name: tests

on:
  push:
  pull_request:

jobs:
  offline:
    # Tests that need an IBM i system skip themselves when TEST_SYSTEM_HOST is not set.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.10", django: "5.2" }
          - { python: "3.12", django: "5.2" }
          - { python: "3.12", django: "6.0" }
          - { python: "3.13", django: "6.1" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install unixODBC (needed by pyodbc)
        run: sudo apt-get update && sudo apt-get install -y unixodbc
      - name: Install package and test dependencies
        run: pip install -e ".[test]" "Django~=${{ matrix.django }}.0"
      - name: Run tests
        run: pytest -p no:cacheprovider
